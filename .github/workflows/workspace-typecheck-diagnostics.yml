name: Repair Workspace Typecheck

on:
  push:
    branches:
      - feature/ytd-lead-workspace

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ytd-lead-workspace
      - name: Fix owner name lookup and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/lead-workspace.ts')
          text = path.read_text()
          old = 'ownerName: ownerNames.get(ownerId) ?? ownerId,'
          new = 'ownerName: ACQUISITION_REPS.find((owner) => owner.id === ownerId)?.name ?? ownerId,'
          if old not in text and new not in text:
              raise SystemExit('Expected owner lookup not found')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/workspace-typecheck-diagnostics.yml
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/lead-workspace.ts .github/workflows/workspace-typecheck-diagnostics.yml
          git commit -m "Fix workspace owner lookup type"
          git push origin HEAD:feature/ytd-lead-workspace
