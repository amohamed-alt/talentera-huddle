name: Deploy Acquisition Dashboard to Hostinger

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: hostinger-talentera-acquisition-v2-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
      HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN || secrets.HUBSPOT_TOKEN || secrets.HUBSPOT_ACCESS_TOKEN }}
    steps:
      - name: Mark deployment pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'pending',
              context: 'hostinger/acquisition-deploy',
              description: 'Deploying Acquisition Intelligence V4 to Hostinger',
              target_url: process.env.DEPLOY_URL,
            });

      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Validate Hostinger API key
        run: |
          test -n "$HOSTINGER_API_KEY" || { echo "::error::Missing HOSTINGER_API_KEY or HOSTINGER_API_TOKEN"; exit 1; }

      - name: Validate HubSpot token
        run: |
          test -n "$HUBSPOT_TOKEN" || { echo "::error::Missing HUBSPOT_PRIVATE_APP_TOKEN, HUBSPOT_TOKEN, or HUBSPOT_ACCESS_TOKEN"; exit 1; }

      - name: Deploy fresh Docker Compose project
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ env.HOSTINGER_API_KEY }}
          virtual-machine: "1604210"
          project-name: talentera-acquisition-v2
          docker-compose-path: docker-compose.yml
          environment-variables: |
            HUBSPOT_PRIVATE_APP_TOKEN=${{ env.HUBSPOT_TOKEN }}
            HUBSPOT_PORTAL_ID=145742477
            HUBSPOT_UI_DOMAIN=app-eu1.hubspot.com
            HUBSPOT_TIMEZONE=Asia/Riyadh
            ACQUISITION_BUILD_REF=${{ env.DEPLOY_SHA }}

      - name: Wait for and verify exact public build
        run: |
          echo "Waiting for Hostinger to finish the asynchronous Docker rollout..."
          sleep 20
          matched=false
          last_health=""

          for attempt in $(seq 1 90); do
            health="$(curl --silent --show-error --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "https://acquisition.dashboardtalentera.tech/api/health?build=${DEPLOY_SHA}&attempt=${attempt}" \
              || true)"
            last_health="$health"

            current="$(HEALTH_RESPONSE="$health" node -e '
              try {
                const health = JSON.parse(process.env.HEALTH_RESPONSE || "{}");
                process.stdout.write(`${health.uiVersion || "missing"} / ${health.buildRef || "missing"}`);
              } catch {
                process.stdout.write("unavailable / unavailable");
              }
            ')"
            echo "Attempt ${attempt}/90: ${current}"

            if HEALTH_RESPONSE="$health" EXPECTED_SHA="$DEPLOY_SHA" node -e '
              try {
                const health = JSON.parse(process.env.HEALTH_RESPONSE || "{}");
                process.exit(
                  health.uiVersion === "acquisition-intelligence-v4" &&
                  health.dataModel === "company-ranked-status-aware" &&
                  health.buildRef === process.env.EXPECTED_SHA
                    ? 0
                    : 1
                );
              } catch {
                process.exit(1);
              }
            '; then
              matched=true
              break
            fi

            sleep 8
          done

          if [ "$matched" != "true" ]; then
            echo "::error::The public domain did not switch to V4 build ${DEPLOY_SHA} within the rollout window."
            echo "Last health response: ${last_health}"
            exit 1
          fi

          echo "Public domain verified on exact V4 build ${DEPLOY_SHA}."

      - name: Verify live HubSpot intelligence payload
        shell: bash
        run: |
          set -euo pipefail
          today="$(date -u +%F)"
          from="$(date -u +%Y-%m-01)"
          endpoint="https://acquisition.dashboardtalentera.tech/api/dashboard?from=${from}&to=${today}&refresh=1&smoke=${DEPLOY_SHA}"
          payload=/tmp/acquisition-dashboard-v4.json
          validated=false

          echo "Validating live HubSpot data from ${from} to ${today}..."
          for attempt in $(seq 1 6); do
            echo "Dashboard smoke attempt ${attempt}/6"
            if curl --fail --silent --show-error --max-time 240 \
              -H 'Cache-Control: no-cache' \
              "$endpoint" \
              -o "$payload"; then
              if DASHBOARD_FILE="$payload" node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync(process.env.DASHBOARD_FILE, 'utf8'));
          const requiredArrays = [
            'leads', 'companies', 'deals', 'followUpLeads', 'excludedLeads',
            'leadStatusBreakdown', 'lifecycleBreakdown', 'sourceBreakdown',
            'rankSummary', 'activities', 'activityTrend', 'repActivity'
          ];
          const missing = requiredArrays.filter((key) => !Array.isArray(data[key]));
          if (data?.meta?.uiVersion !== 'acquisition-intelligence-v4') {
            throw new Error(`Unexpected uiVersion: ${data?.meta?.uiVersion || 'missing'}`);
          }
          if (data?.meta?.companyRankProperty !== 'rank') {
            throw new Error(`Unexpected Company Rank property: ${data?.meta?.companyRankProperty || 'missing'}`);
          }
          if (missing.length) throw new Error(`Missing array fields: ${missing.join(', ')}`);
          if (!data.leads.length) throw new Error('No leads returned for month-to-date smoke range');
          if (!data.companies.length) throw new Error('No associated companies returned');
          if (!data.leadStatusBreakdown.length) throw new Error('Lead Status breakdown is empty');
          if (!data.activityTrend.length) throw new Error('Activity trend is empty');
          if (!data.companies.some((company) => ['A', 'B'].includes(company.rank))) {
            throw new Error('No Rank A/B companies were resolved from Company.rank');
          }
          console.log(JSON.stringify({
            uiVersion: data.meta.uiVersion,
            rankProperty: data.meta.companyRankProperty,
            leads: data.leads.length,
            companies: data.companies.length,
            rankABCompanies: data.companies.filter((company) => ['A', 'B'].includes(company.rank)).length,
            leadStatuses: data.leadStatusBreakdown.length,
            activities: data.activities.length,
            trendPoints: data.activityTrend.length,
            warnings: data.meta.warnings?.length || 0,
          }, null, 2));
          NODE
              then
                validated=true
                break
              fi
            fi
            sleep 15
          done

          if [ "$validated" != "true" ]; then
            echo "::error::The live Acquisition Intelligence V4 payload failed validation."
            if [ -s "$payload" ]; then
              echo "Response preview:"
              head -c 1200 "$payload" || true
              echo
            fi
            exit 1
          fi

      - name: Mark deployment successful
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'success',
              context: 'hostinger/acquisition-deploy',
              description: 'Verified V4 build and live HubSpot intelligence payload',
              target_url: process.env.DEPLOY_URL,
            });

      - name: Mark deployment failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'failure',
              context: 'hostinger/acquisition-deploy',
              description: 'Acquisition Intelligence V4 failed production verification',
              target_url: process.env.DEPLOY_URL,
            });
