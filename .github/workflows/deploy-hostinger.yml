name: Deploy Acquisition Dashboard to Hostinger

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: hostinger-talentera-acquisition-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
      HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN || secrets.HUBSPOT_TOKEN || secrets.HUBSPOT_ACCESS_TOKEN }}
    steps:
      - name: Mark deployment pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'pending',
              context: 'hostinger/acquisition-deploy',
              description: 'Deploying acquisition dashboard to Hostinger',
              target_url: process.env.DEPLOY_URL,
            });

      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Validate Hostinger API key
        run: |
          test -n "$HOSTINGER_API_KEY" || { echo "::error::Missing HOSTINGER_API_KEY or HOSTINGER_API_TOKEN"; exit 1; }

      - name: Validate HubSpot token
        run: |
          test -n "$HUBSPOT_TOKEN" || { echo "::error::Missing HUBSPOT_PRIVATE_APP_TOKEN, HUBSPOT_TOKEN, or HUBSPOT_ACCESS_TOKEN"; exit 1; }

      - name: Deploy Docker Compose
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ env.HOSTINGER_API_KEY }}
          virtual-machine: "1604210"
          project-name: talentera-acquisition
          docker-compose-path: docker-compose.yml
          environment-variables: |
            HUBSPOT_PRIVATE_APP_TOKEN=${{ env.HUBSPOT_TOKEN }}
            HUBSPOT_PORTAL_ID=145742477
            HUBSPOT_UI_DOMAIN=app-eu1.hubspot.com
            HUBSPOT_TIMEZONE=Asia/Riyadh
            ACQUISITION_BUILD_REF=${{ env.DEPLOY_SHA }}

      - name: Verify public health
        run: |
          curl --fail --silent --show-error \
            --retry 45 \
            --retry-delay 8 \
            --retry-all-errors \
            https://acquisition.dashboardtalentera.tech/api/health

      - name: Mark deployment successful
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'success',
              context: 'hostinger/acquisition-deploy',
              description: 'Acquisition dashboard deployed successfully',
              target_url: process.env.DEPLOY_URL,
            });

      - name: Mark deployment failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'failure',
              context: 'hostinger/acquisition-deploy',
              description: 'Acquisition dashboard deployment failed',
              target_url: process.env.DEPLOY_URL,
            });
