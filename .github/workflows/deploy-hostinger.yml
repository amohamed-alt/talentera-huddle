name: Deploy Acquisition Dashboard to Hostinger

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: hostinger-talentera-acquisition-v2-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY || secrets.HOSTINGER_API_TOKEN }}
      HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN || secrets.HUBSPOT_TOKEN || secrets.HUBSPOT_ACCESS_TOKEN }}
    steps:
      - name: Mark deployment pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'pending',
              context: 'hostinger/acquisition-deploy',
              description: 'Deploying fresh Acquisition V2 service to Hostinger',
              target_url: process.env.DEPLOY_URL,
            });

      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Validate Hostinger API key
        run: |
          test -n "$HOSTINGER_API_KEY" || { echo "::error::Missing HOSTINGER_API_KEY or HOSTINGER_API_TOKEN"; exit 1; }

      - name: Validate HubSpot token
        run: |
          test -n "$HUBSPOT_TOKEN" || { echo "::error::Missing HUBSPOT_PRIVATE_APP_TOKEN, HUBSPOT_TOKEN, or HUBSPOT_ACCESS_TOKEN"; exit 1; }

      - name: Deploy fresh Docker Compose project
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ env.HOSTINGER_API_KEY }}
          virtual-machine: "1604210"
          project-name: talentera-acquisition-v2
          docker-compose-path: docker-compose.yml
          environment-variables: |
            HUBSPOT_PRIVATE_APP_TOKEN=${{ env.HUBSPOT_TOKEN }}
            HUBSPOT_PORTAL_ID=145742477
            HUBSPOT_UI_DOMAIN=app-eu1.hubspot.com
            HUBSPOT_TIMEZONE=Asia/Riyadh
            ACQUISITION_BUILD_REF=${{ env.DEPLOY_SHA }}

      - name: Wait for and verify exact public build
        run: |
          echo "Waiting for Hostinger to finish the asynchronous Docker rollout..."
          sleep 20
          matched=false
          last_health=""

          for attempt in $(seq 1 90); do
            health="$(curl --silent --show-error --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "https://acquisition.dashboardtalentera.tech/api/health?build=${DEPLOY_SHA}&attempt=${attempt}" \
              || true)"
            last_health="$health"

            current="$(HEALTH_RESPONSE="$health" node -e '
              try {
                const health = JSON.parse(process.env.HEALTH_RESPONSE || "{}");
                process.stdout.write(`${health.uiVersion || "missing"} / ${health.buildRef || "missing"}`);
              } catch {
                process.stdout.write("unavailable / unavailable");
              }
            ')"
            echo "Attempt ${attempt}/90: ${current}"

            if HEALTH_RESPONSE="$health" EXPECTED_SHA="$DEPLOY_SHA" node -e '
              try {
                const health = JSON.parse(process.env.HEALTH_RESPONSE || "{}");
                process.exit(health.uiVersion === "sdr-style-v2" && health.buildRef === process.env.EXPECTED_SHA ? 0 : 1);
              } catch {
                process.exit(1);
              }
            '; then
              matched=true
              break
            fi

            sleep 8
          done

          if [ "$matched" != "true" ]; then
            echo "::error::The public domain did not switch to build ${DEPLOY_SHA} within the rollout window."
            echo "Last health response: ${last_health}"
            exit 1
          fi

          echo "Public domain verified on exact build ${DEPLOY_SHA}."

      - name: Mark deployment successful
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'success',
              context: 'hostinger/acquisition-deploy',
              description: 'Verified fresh Acquisition V2 build on Hostinger',
              target_url: process.env.DEPLOY_URL,
            });

      - name: Mark deployment failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.DEPLOY_SHA,
              state: 'failure',
              context: 'hostinger/acquisition-deploy',
              description: 'Fresh Acquisition V2 deployment failed verification',
              target_url: process.env.DEPLOY_URL,
            });
