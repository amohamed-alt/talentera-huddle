name: Workspace Typecheck Diagnostics

on:
  push:
    branches:
      - feature/ytd-lead-workspace

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ytd-lead-workspace
      - name: Apply owner map typing fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/lead-workspace.ts')
          text = path.read_text()
          text = text.replace(
              'const ownerNames = new Map(ACQUISITION_REPS.map((owner) => [owner.id, owner.name]));',
              'const ownerNames = new Map<string, string>(ACQUISITION_REPS.map((owner) => [owner.id, owner.name]));',
          )
          path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/lead-workspace.ts
          if ! git diff --cached --quiet; then
            git commit -m "Fix lead workspace owner map typing"
            git push origin HEAD:feature/ytd-lead-workspace
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --silent
      - name: Capture TypeScript diagnostics
        run: |
          set +e
          npm run typecheck --silent > /tmp/typecheck.log 2>&1
          grep -E "error TS|^src/" /tmp/typecheck.log > /tmp/typecheck-errors.log || true
          exit 0
      - name: Comment diagnostics
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const errors = fs.readFileSync('/tmp/typecheck-errors.log', 'utf8').trim() || 'No TypeScript errors found.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 12,
              body: `Temporary typecheck diagnostics:\n\n\`\`\`text\n${errors.slice(0, 60000)}\n\`\`\``,
            });
