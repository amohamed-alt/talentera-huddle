name: Apply All-Time Workspace Upgrade

on:
  push:
    branches:
      - feature/all-time-lead-workspace

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/all-time-lead-workspace
      - name: Apply upgrade
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f"Pattern not found in {path}: {old[:140]}")
              p.write_text(text.replace(old, new))

          replace('src/app/api/lead-workspace/route.ts', 'year: z.coerce.number().int().min(2020).max(2100).default(new Date().getUTCFullYear()),', 'year: z.coerce.number().int().min(0).max(2100).default(0),')
          replace('src/lib/lead-workspace.ts', 'function snapshotPath(year: number) {\n  return path.join(CACHE_DIR, `lead-workspace-${year}.json`);\n}', 'function snapshotPath(year: number) {\n  return path.join(CACHE_DIR, year === 0 ? "lead-workspace-all.json" : `lead-workspace-${year}.json`);\n}')

          replace('src/lib/lead-workspace.ts', '''  const now = new Date();\n  const end = year === now.getUTCFullYear() ? now : yearEnd(year);\n  const records = await searchAll("contacts", CONTACT_PROPERTIES, [\n    { propertyName: "createdate", operator: "BETWEEN", value: timestamp(yearStart(year)), highValue: timestamp(end) },\n    { propertyName: "hubspot_owner_id", operator: "IN", values: [...ACQUISITION_OWNER_IDS] },\n  ], ["-createdate"]);''', '''  const now = new Date();\n  const end = year === now.getUTCFullYear() ? now : yearEnd(year);\n  const filters = [\n    { propertyName: "hubspot_owner_id", operator: "IN", values: [...ACQUISITION_OWNER_IDS] },\n  ];\n  if (year !== 0) {\n    filters.unshift({ propertyName: "createdate", operator: "BETWEEN", value: timestamp(yearStart(year)), highValue: timestamp(end) });\n  }\n  const records = await searchAll("contacts", CONTACT_PROPERTIES, filters, ["-createdate"]);''')

          replace('src/lib/lead-workspace.ts', '''  const now = new Date();\n  const end = year === now.getUTCFullYear() ? now : yearEnd(year);\n  const previousCursor = new Date(previous.cursor).getTime();\n  const overlapStart = new Date(Math.max(yearStart(year).getTime(), Number.isFinite(previousCursor) ? previousCursor - DELTA_INTERVAL_MS : yearStart(year).getTime()));\n  const records = await searchAll("contacts", CONTACT_PROPERTIES, [\n    { propertyName: "createdate", operator: "BETWEEN", value: timestamp(yearStart(year)), highValue: timestamp(end) },\n    { propertyName: "hs_lastmodifieddate", operator: "BETWEEN", value: timestamp(overlapStart), highValue: timestamp(now) },\n    { propertyName: "hubspot_owner_id", operator: "IN", values: [...ACQUISITION_OWNER_IDS] },\n  ], ["-hs_lastmodifieddate"]);''', '''  const now = new Date();\n  const end = year === now.getUTCFullYear() ? now : yearEnd(year);\n  const previousCursor = new Date(previous.cursor).getTime();\n  const floor = year === 0 ? 0 : yearStart(year).getTime();\n  const overlapStart = new Date(Math.max(floor, Number.isFinite(previousCursor) ? previousCursor - DELTA_INTERVAL_MS : floor));\n  const filters = [\n    { propertyName: "hs_lastmodifieddate", operator: "BETWEEN", value: timestamp(overlapStart), highValue: timestamp(now) },\n    { propertyName: "hubspot_owner_id", operator: "IN", values: [...ACQUISITION_OWNER_IDS] },\n  ];\n  if (year !== 0) {\n    filters.unshift({ propertyName: "createdate", operator: "BETWEEN", value: timestamp(yearStart(year)), highValue: timestamp(end) });\n  }\n  const records = await searchAll("contacts", CONTACT_PROPERTIES, filters, ["-hs_lastmodifieddate"]);''')

          replace('src/lib/lead-workspace.ts', '''  const lastFull = new Date(snapshot.fullSyncedAt).getTime();\n  if (!Number.isFinite(lastFull) || Date.now() - lastFull >= FULL_INTERVAL_MS) {\n    return { snapshot: await runLocked(year, () => fullSync(year, snapshot)), mode: "full" };\n  }\n  const lastDelta = new Date(snapshot.generatedAt).getTime();\n  if (refresh === "delta" || !Number.isFinite(lastDelta) || Date.now() - lastDelta >= DELTA_INTERVAL_MS) {\n    return { snapshot: await runLocked(year, () => deltaSync(year, snapshot)), mode: "delta" };\n  }\n  return { snapshot, mode: "cache" };''', '''  if (refresh === "delta") {\n    return { snapshot: await runLocked(year, () => deltaSync(year, snapshot)), mode: "delta" };\n  }\n  return { snapshot, mode: "cache" };''')

          replace('src/lib/lead-workspace.ts', '''  const created = new Date(lead.createdAt);\n  if (Number.isNaN(created.getTime())) return;\n  const year = created.getUTCFullYear();\n  const snapshot = await readSnapshot(year);''', '''  const created = new Date(lead.createdAt);\n  if (Number.isNaN(created.getTime())) return;\n  const year = 0;\n  const snapshot = await readSnapshot(year);''')

          replace('src/components/LeadWorkspace.tsx', 'const currentYear = new Date().getUTCFullYear();\n  const [year] = useState(currentYear);', 'const [year] = useState(0);')
          replace('src/components/LeadWorkspace.tsx', 'const [pageSize, setPageSize] = useState(50);', 'const [pageSize, setPageSize] = useState(25);')
          replace('src/components/LeadWorkspace.tsx', '<h1>YTD Lead Workspace</h1>', '<h1>All-Time Lead Workspace</h1>')
          replace('src/components/LeadWorkspace.tsx', '<p>Prioritised lead queues, live HubSpot tasks and low-memory incremental sync.</p>', '<p>Every Acquisition lead since HubSpot go-live, ready from a persisted snapshot.</p>')
          replace('src/components/LeadWorkspace.tsx', '{ label: "All YTD leads", value: data.summary.total,', '{ label: "All-time leads", value: data.summary.total,')
          replace('src/components/LeadWorkspace.tsx', '<div><span>REPORTING PERIOD</span><strong>01 Jan {year} – Today</strong></div>', '<div><span>REPORTING PERIOD</span><strong>All HubSpot history</strong></div>')
          replace('src/components/LeadWorkspace.tsx', '<div><span>RESOURCE MODE</span><strong>Disk cache + paginated API</strong></div>', '<div><span>READY MODE</span><strong>Pre-synced · instant open</strong></div>')
          replace('src/components/LeadWorkspace.tsx', 'stateFilter === "all" ? "All YTD leads" : stateLabels[stateFilter]', 'stateFilter === "all" ? "All-time leads" : stateLabels[stateFilter]')
          replace('src/components/LeadWorkspace.tsx', 'Loading the saved YTD snapshot…', 'Opening the ready workspace…')
          replace('src/components/LeadWorkspace.tsx', '<small>LEAD OPERATING SYSTEM</small>', '<small>ALL-TIME LEAD OPERATING SYSTEM</small>')
          replace('src/components/LeadWorkspace.tsx', 'Disk-backed cache', 'Pre-synced disk snapshot')
          replace('src/components/LeadWorkspace.tsx', '>Full reconcile</button>', '>Rebuild all history</button>')

          css = Path('src/components/LeadWorkspace.module.css')
          text = css.read_text()
          marker = '/* All-Time Workspace polish */'
          if marker not in text:
              text += '''\n\n/* All-Time Workspace polish */\n.shell { background: radial-gradient(circle at 78% 6%, rgba(78, 170, 133, .08), transparent 28%), #f3f7f5; }\n.topbar { min-height: 78px; padding-top: 12px; padding-bottom: 12px; border-top-width: 6px; box-shadow: 0 8px 28px rgba(13, 69, 53, .05); }\n.titleBlock h1 { font-size: 26px; letter-spacing: -.55px; }\n.sidebar { width: 272px; padding-left: 14px; padding-right: 14px; background: linear-gradient(180deg, #075548, #0a493f); }\n.layout { grid-template-columns: 272px minmax(0, 1fr); }\n.topbar { padding-left: 304px; }\n.content { padding: 20px 24px 36px; }\n.contextBar { min-height: 60px; border-radius: 15px; box-shadow: 0 10px 26px rgba(19, 74, 58, .04); }\n.cardsGrid { gap: 11px; margin-top: 13px; }\n.summaryCard { min-height: 116px; padding: 14px 15px; border-radius: 15px; box-shadow: 0 8px 22px rgba(18, 69, 54, .045); transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease; }\n.summaryCard strong { margin-top: 14px; font-size: 28px; }\n.summaryCard small { margin-top: 9px; }\n.filterPanel { position: sticky; top: 84px; z-index: 25; margin-top: 13px; padding: 12px; border-radius: 15px; box-shadow: 0 10px 28px rgba(18, 69, 54, .06); }\n.changePanel, .queuePanel, .guidanceFooter { margin-top: 13px; border-radius: 15px; box-shadow: 0 10px 28px rgba(18, 69, 54, .045); }\n.tableWrap table { font-size: 11px; }\n@media (max-width: 1180px) { .sidebar { width: 238px; } .layout { grid-template-columns: 238px minmax(0, 1fr); } .topbar { padding-left: 266px; } }\n'''
              css.write_text(text)

          Path('.github/workflows/apply-all-time-workspace.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Upgrade lead workspace to all-time instant-ready mode"
          git push origin HEAD:feature/all-time-lead-workspace
