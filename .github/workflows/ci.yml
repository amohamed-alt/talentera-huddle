name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - name: Apply drawer naming fix
        if: github.head_ref == 'feature/rep-roles-and-detailed-workspaces'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/AcquisitionDashboardDetailed.tsx')
          text = path.read_text()
          text = text.replace('function openDeals(title:', 'function openDealsDrawer(title:')
          text = text.replace('openDeals("', 'openDealsDrawer("')
          text = text.replace('onOpen={openDeals}', 'onOpen={openDealsDrawer}')
          text = text.replace('onDeals={openDeals}', 'onDeals={openDealsDrawer}')
          path.write_text(text)
          PY
      - name: Commit drawer naming fix
        if: github.head_ref == 'feature/rep-roles-and-detailed-workspaces'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/AcquisitionDashboardDetailed.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Fix deal drawer naming collision"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
