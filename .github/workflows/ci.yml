name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - name: Run TypeScript check
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee typecheck.log
          exit ${PIPESTATUS[0]}
      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail on TypeScript errors
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
      - run: npm run build
