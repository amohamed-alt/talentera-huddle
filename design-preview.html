<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talentera Huddle · Design Preview</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f7f4;font-family:Inter,system-ui,sans-serif;color:#183026}
    .loader{display:flex;align-items:center;gap:12px;padding:16px 20px;border:1px solid #dfe9e3;border-radius:16px;background:#fff;box-shadow:0 12px 35px rgba(24,48,38,.08);font-size:13px;font-weight:700}
    .spinner{width:20px;height:20px;border:2px solid #dce9e1;border-top-color:#0f7a45;border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .error{max-width:520px;line-height:1.6;color:#b42318}
  </style>
</head>
<body>
  <div class="loader" id="previewState"><span class="spinner"></span>Loading design preview…</div>
  <script>
    (async function loadPreview(){
      const state=document.getElementById('previewState');
      try{
        const response=await fetch('./index.html?previewSource='+Date.now(),{cache:'no-store'});
        if(!response.ok)throw new Error('Could not load the current dashboard. HTTP '+response.status);
        let html=await response.text();
        const stylesheet='<link rel="stylesheet" href="./design-preview.css?v='+Date.now()+'">';
        if(!html.includes('</head>'))throw new Error('The dashboard HTML does not contain a closing head tag.');
        html=html.replace('</head>',stylesheet+'</head>');
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        state.className='loader error';
        state.innerHTML='Design preview failed to load: '+String(error.message||error);
      }
    })();
  </script>
</body>
</html>
